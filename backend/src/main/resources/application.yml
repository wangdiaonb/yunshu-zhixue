server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 20s
    # 超限上传时先丢弃请求体再返回 JSON 错误，避免浏览器看到连接重置
    max-swallow-size: 25MB

spring:
  application:
    name: yunshu-zhixue
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: false

# 持久层：自增主键 + 逻辑删除 + 下划线映射（database-rules）
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口契约（D21）：/v3/api-docs/portal 与 /v3/api-docs/admin
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-flat-param-object: true
  packages-to-scan: com.yunshu.zhixue.modules

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    portal:
      access-ttl: 2h
      refresh-ttl: 14d
    admin:
      access-ttl: 2h
      refresh-ttl: 14d
  # 后台新增用户的默认密码（Q9：走应用配置，不改 system_setting）
  default-password: ${APP_DEFAULT_PASSWORD:Yszx@123456}
  # 短信验证码：本地开发打印到日志便于自测；生产默认关闭，接入短信平台后替换发送实现
  sms:
    log-code: ${SMS_LOG_CODE:false}
  # AI 能力层（仅境内调用；密钥只走环境变量，不落库）
  ai:
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    connect-timeout: 5s
    read-timeout: 120s
    max-retries: 2
  storage:
    enabled: true
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:/files}
    bucket: ${MINIO_BUCKET:yszx}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
