# 本地开发环境：连接 deploy/docker-compose.yml 启动的 MySQL/Redis/MinIO
# 宿主机端口默认 3307 / 6380 / 9002（见 deploy/.env），可按需覆盖环境变量
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_HOST_PORT:3307}/${MYSQL_DATABASE:yszx}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:yszx}
    password: ${MYSQL_PASSWORD:YszxApp2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: yszx-hikari
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_HOST_PORT:6380}
      password: ${REDIS_PASSWORD:YszxRedis2026}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s

app:
  jwt:
    portal:
      secret: ${JWT_PORTAL_SECRET:dev-only-portal-jwt-secret-key-change-me-32}
    admin:
      secret: ${JWT_ADMIN_SECRET:dev-only-admin-jwt-secret-key-change-me-3232}
  storage:
    endpoint: http://127.0.0.1:${MINIO_API_HOST_PORT:9002}
    access-key: ${MINIO_ROOT_USER:yszxadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:YszxMinio2026}
  sms:
    log-code: true

logging:
  level:
    root: info
    com.yunshu.zhixue: debug
    org.springframework.security: info
