# 云枢智学同域分区入口（D20）
#   /        → 学员端静态产物（portal-web/dist）
#   /admin/  → 管理端静态产物（admin-web/dist，Vite base=/admin/）
#   /api/    → 后端 Spring Boot
#   /files/  → MinIO Bucket（公开图片）
#
# 产物目录约定：
#   /usr/share/nginx/html/portal/index.html
#   /usr/share/nginx/html/admin/index.html
upstream yszx_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 后端容器化部署时改为服务名（如 backend:8080），并用 Docker 内置 DNS 解析
# resolver 127.0.0.11 valid=30s;

server {
    listen       80;
    server_name  _;

    # 同域部署不开放 CORS；如需 HTTPS，证书只维护这一张
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ---------- 学员端 ----------
    location / {
        root      /usr/share/nginx/html/portal;
        index     index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- 管理端 ----------
    location /admin/ {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---------- 静态资源缓存（带 hash 的构建产物） ----------
    location ~* ^/admin/assets/ {
        root      /usr/share/nginx/html;
        expires   7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~* ^/assets/ {
        root      /usr/share/nginx/html/portal;
        expires   7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ---------- SSE 流式接口（AI 面试逐题评分 / 简答批改） ----------
    # 必须关闭响应缓冲、放宽读超时（单问 5 分钟，读超时须大于该值）
    location ~ ^/api/portal/v1/(interview|study)/ {
        proxy_pass         http://yszx_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header         X-Accel-Buffering no;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass         http://yszx_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # ---------- 对象存储图片（Bucket 需与 MINIO_BUCKET 一致） ----------
    # 宿主机部署按 deploy/.env 映射端口 9002；Nginx 与 MinIO 同处 yszx-net 时改为 http://minio:9000/yszx/
    location /files/ {
        proxy_pass         http://127.0.0.1:9002/yszx/;
        proxy_set_header   Host $host;
        proxy_buffering    on;
        expires            1d;
    }

    # ---------- 运维端点不对外 ----------
    location ~ ^/(actuator|v3/api-docs|swagger-ui) {
        return 404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
